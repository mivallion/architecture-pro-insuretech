apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  namespace: insuretech
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
    spec:
      containers:
        - name: scaletestapp
          imagePullPolicy: IfNotPresent
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: 8Mi
            limits:
              memory: 30Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
