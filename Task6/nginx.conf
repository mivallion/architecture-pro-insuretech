http {
    # Предполагается, что шлюз проверяет X-API-Key до передачи запроса в Nginx.
    # Без ключа лимит применяется к IP-адресу, а не к партнёру.
    map $http_x_api_key $rate_limit_key {
        ""      $binary_remote_addr;
        default $http_x_api_key;
    }

    # Лимит для каждого ключа: 10 запросов в минуту, без всплесков (burst).
    limit_req_zone $rate_limit_key zone=partner_requests:10m rate=10r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            limit_req zone=partner_requests nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://backend_servers;
        }
    }
}
